openapi: 3.0.3
info:
  title: YourGateway Merchant API
  version: 1.0.0
  description: |
    Public server-to-server API for creating hosted checkout sessions and reading payments.
    Monetary amounts are integer minor units. The v1 implementation operates in test mode only.
servers:
  - url: https://api.yourgateway.com
security:
  - bearerApiKey: []
tags:
  - name: Checkout sessions
  - name: Payments
paths:
  /v1/checkout-sessions:
    post:
      tags: [Checkout sessions]
      summary: Create a hosted checkout session
      operationId: createCheckoutSession
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutSessionRequest'
            example:
              amount: 19900
              currency: DKK
              merchant_reference: order-2026-00472
              return_url: https://merchant.example/return?o=472
              cancel_url: https://merchant.example/cancel?o=472
              customer:
                email: kunde@example.dk
                reference: cust_9982
              description: 'Order #472'
              locale: da-DK
              metadata:
                cart_id: abc123
      responses:
        '201':
          description: Checkout session created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/checkout-sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/CheckoutSessionId'
    get:
      tags: [Checkout sessions]
      summary: Retrieve a checkout session
      operationId: retrieveCheckoutSession
      responses:
        '200':
          description: Current checkout session state
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/checkout-sessions/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/CheckoutSessionId'
    post:
      tags: [Checkout sessions]
      summary: Cancel a checkout session
      operationId: cancelCheckoutSession
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Checkout session cancelled
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/payments/{id}:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
    get:
      tags: [Payments]
      summary: Retrieve a payment
      operationId: retrievePayment
      responses:
        '200':
          description: Payment found
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/payments:
    get:
      tags: [Payments]
      summary: List payments
      operationId: listPayments
      parameters:
        - name: limit
          in: query
          description: Maximum number of payments to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: starting_after
          in: query
          description: Payment ID of the final item from the previous page.
          schema:
            type: string
        - name: created.gte
          in: query
          description: Inclusive lower creation-time bound in Unix epoch seconds.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: created.lte
          in: query
          description: Inclusive upper creation-time bound in Unix epoch seconds.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: Cursor-paginated payments, newest first
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: sk_test_… or sk_live_…
      description: Secret API key issued once by YourGateway.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Canonical UUID identifying one logical POST operation for 24 hours.
      schema:
        type: string
        format: uuid
    CheckoutSessionId:
      name: id
      in: path
      required: true
      description: Checkout session identifier. Malformed and unknown values both return 404.
      schema:
        type: string
    PaymentId:
      name: id
      in: path
      required: true
      description: Payment identifier. Malformed, unknown, and foreign-owned values all return 404.
      schema:
        type: string

  headers:
    RequestId:
      description: Request identifier to include in support requests.
      required: true
      schema:
        type: string
        pattern: '^req_[0-9A-HJKMNP-TV-Z]{26}$'
    IdempotentReplay:
      description: Present and true when a response was replayed from the idempotency store.
      schema:
        type: boolean
    RateLimitLimit:
      description: Maximum token-bucket capacity for this service instance.
      required: true
      schema:
        type: integer
        example: 200
    RateLimitRemaining:
      description: Whole request tokens remaining after this request.
      required: true
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: Seconds until the bucket is completely full.
      required: true
      schema:
        type: integer
        minimum: 0
    RetryAfter:
      description: Seconds until at least one request token is available.
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: Request validation failed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: API key is missing, malformed, invalid, or revoked.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The authenticated merchant may not perform this operation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found. Ownership is intentionally not disclosed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Resource state or idempotency conflict.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: The API-key token bucket is exhausted.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Unexpected gateway failure.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: A required gateway dependency is unavailable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    CreateCheckoutSessionRequest:
      type: object
      additionalProperties: false
      required:
        - amount
        - currency
        - merchant_reference
        - return_url
        - cancel_url
      properties:
        amount:
          type: integer
          format: int64
          minimum: 100
          maximum: 99999999
          description: Amount in the currency's minor unit.
        currency:
          $ref: '#/components/schemas/Currency'
        merchant_reference:
          type: string
          minLength: 1
          maxLength: 255
          description: Unique per merchant; leading, trailing, and control characters are rejected.
        return_url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          description: HTTPS URL matching the merchant's configured return URL pattern.
        cancel_url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          description: HTTPS URL matching the merchant's configured cancellation URL pattern.
        customer:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Customer'
        description:
          type: string
          minLength: 1
          maxLength: 500
          nullable: true
        locale:
          type: string
          enum: [da-DK, en-US]
          default: en-US
          nullable: true
        metadata:
          type: object
          nullable: true
          maxProperties: 50
          description: Keys contain 1–40 characters; string values contain 1–500 characters.
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 500

    Customer:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 320
          nullable: true
        reference:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true

    CheckoutSession:
      type: object
      required:
        - id
        - object
        - status
        - url
        - amount
        - currency
        - merchant_reference
        - expires_at
        - created
        - livemode
        - payment_id
        - next_action
      properties:
        id:
          $ref: '#/components/schemas/CheckoutSessionExternalId'
        object:
          type: string
          enum: [checkout_session]
        status:
          type: string
          enum: [CREATED, IN_PROGRESS, COMPLETED, CANCELLED, EXPIRED]
        url:
          type: string
          format: uri
          nullable: true
          description: Hosted checkout URL. It can be unavailable if its protected secret cannot be recovered.
        amount:
          type: integer
          format: int64
          minimum: 100
          maximum: 99999999
        currency:
          $ref: '#/components/schemas/Currency'
        merchant_reference:
          type: string
          minLength: 1
          maxLength: 255
        expires_at:
          $ref: '#/components/schemas/EpochSeconds'
        created:
          $ref: '#/components/schemas/EpochSeconds'
        livemode:
          type: boolean
          description: Always false in v1 because only the test acquirer is available.
        payment_id:
          type: string
          pattern: '^pay_[0-9A-HJKMNP-TV-Z]{26}$'
          nullable: true
        next_action:
          nullable: true
          description: Reserved for a future 3DS challenge and always null in v1.
          allOf:
            - $ref: '#/components/schemas/NextAction'

    NextAction:
      type: object
      required: [type, url]
      properties:
        type:
          type: string
          enum: [challenge]
        url:
          type: string
          format: uri

    Payment:
      type: object
      required:
        - id
        - object
        - checkout_session_id
        - amount
        - amount_captured
        - amount_refunded
        - currency
        - status
        - payment_method
        - payment_method_details
        - merchant_reference
        - failure_code
        - failure_message
        - created
        - authorized_at
        - captured_at
        - metadata
        - livemode
      properties:
        id:
          $ref: '#/components/schemas/PaymentExternalId'
        object:
          type: string
          enum: [payment]
        checkout_session_id:
          $ref: '#/components/schemas/CheckoutSessionExternalId'
        amount:
          type: integer
          format: int64
          minimum: 0
        amount_captured:
          type: integer
          format: int64
          minimum: 0
        amount_refunded:
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          type: string
          enum:
            - PENDING
            - AUTHORIZED
            - CAPTURED
            - FAILED
            - CANCELLED
            - REFUNDED
            - PARTIALLY_REFUNDED
            - REQUIRES_CHALLENGE
          description: v1 produces PENDING, CAPTURED, or FAILED; other values reserve future state-machine paths.
        payment_method:
          type: string
          enum: [card]
        payment_method_details:
          $ref: '#/components/schemas/PaymentMethodDetails'
        merchant_reference:
          type: string
          minLength: 1
          maxLength: 255
        failure_code:
          type: string
          maxLength: 64
          nullable: true
        failure_message:
          type: string
          nullable: true
        created:
          $ref: '#/components/schemas/EpochSeconds'
        authorized_at:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        captured_at:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        metadata:
          type: object
          additionalProperties: {}
        livemode:
          type: boolean
          description: Always false in v1 because only the test acquirer is available.

    PaymentMethodDetails:
      type: object
      required: [brand, last4, exp_month, exp_year, country]
      properties:
        brand:
          type: string
          enum: [visa, mastercard]
        last4:
          type: string
          pattern: '^[0-9]{4}$'
        exp_month:
          type: integer
          minimum: 1
          maximum: 12
        exp_year:
          type: integer
          minimum: 2000
        country:
          type: string
          pattern: '^[A-Z]{2}$'
          nullable: true

    PaymentList:
      type: object
      required: [object, data, has_more, url]
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        has_more:
          type: boolean
        url:
          type: string
          enum: [/v1/payments]

    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'

    Error:
      type: object
      additionalProperties: false
      required: [type, code, message, request_id]
      properties:
        type:
          type: string
          enum:
            - validation_error
            - authentication_error
            - permission_error
            - idempotency_key_conflict
            - conflict_error
            - not_found
            - rate_limit_error
            - api_error
            - acquirer_unavailable
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        param:
          type: string
          nullable: true
        request_id:
          type: string
          pattern: '^req_[0-9A-HJKMNP-TV-Z]{26}$'

    Currency:
      type: string
      enum: [DKK, EUR, USD, SEK, NOK]

    EpochSeconds:
      type: integer
      format: int64
      minimum: 0

    CheckoutSessionExternalId:
      type: string
      pattern: '^cs_[0-9A-HJKMNP-TV-Z]{26}$'

    PaymentExternalId:
      type: string
      pattern: '^pay_[0-9A-HJKMNP-TV-Z]{26}$'
