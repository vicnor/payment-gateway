name: Merchant API contract

on:
  pull_request:
    paths:
      - '.github/workflows/merchant-api-contract.yml'
      - 'pom.xml'
      - 'shared/shared-api/**'
      - 'shared/shared-testing/**'
      - 'services/checkout-service/**'
      - 'services/payment-service/**'
      - 'docs/architecture/api.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/merchant-api-contract.yml'
      - 'pom.xml'
      - 'shared/shared-api/**'
      - 'shared/shared-testing/**'
      - 'services/checkout-service/**'
      - 'services/payment-service/**'
      - 'docs/architecture/api.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Validate specification and controller contracts
        run: ./mvnw -pl services/payment-service,services/checkout-service -am verify

      - name: Check whether the base revision has a contract
        if: github.event_name == 'pull_request'
        id: baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SPEC_PATH: shared/shared-api/src/main/resources/openapi/merchant-api-v1.yaml
        run: |
          if git cat-file -e "${BASE_SHA}:${SPEC_PATH}" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject incompatible Merchant API changes
        if: github.event_name == 'pull_request' && steps.baseline.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@5e81b5c380accc6b523f9d32a637ca630e33620b # v0
        with:
          base: '${{ github.event.pull_request.base.sha }}:shared/shared-api/src/main/resources/openapi/merchant-api-v1.yaml'
          revision: 'HEAD:shared/shared-api/src/main/resources/openapi/merchant-api-v1.yaml'
          fail-on: WARN
