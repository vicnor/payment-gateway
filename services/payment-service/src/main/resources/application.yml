spring:
  application:
    name: payment-service
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8102

management:
  endpoints:
    web:
      exposure:
        include: health

gateway:
  payment:
    token-service:
      base-url: "${GATEWAY_TOKEN_SERVICE_URL:http://localhost:8103}"
      internal-token: "${PAYMENT_SERVICE_INTERNAL_SECRET:}"
    acquirer-service:
      base-url: "${GATEWAY_ACQUIRER_SERVICE_URL:http://localhost:8105}"
      internal-token: "${PAYMENT_SERVICE_INTERNAL_SECRET:}"
    internal:
      callers: []
