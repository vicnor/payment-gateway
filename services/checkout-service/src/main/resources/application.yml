spring:
  task:
    scheduling:
      pool:
        size: 3
  application:
    name: checkout-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: 8100

management:
  endpoints:
    web:
      exposure:
        include: health

gateway:
  aws:
    region: "${AWS_REGION:eu-north-1}"
    dynamodb:
      endpoint: "${GATEWAY_DYNAMODB_ENDPOINT:}"
    sns:
      endpoint: "${GATEWAY_SNS_ENDPOINT:}"
    kms:
      endpoint: "${GATEWAY_KMS_ENDPOINT:}"
      key-id: "${GATEWAY_CHECKOUT_KMS_KEY_ID:alias/checkout-idempotency-dev}"
  checkout:
    workers:
      enabled: true
    outbox:
      topic-arn: "${GATEWAY_CHECKOUT_EVENTS_TOPIC_ARN:}"
    base-url: "${GATEWAY_CHECKOUT_BASE_URL:https://checkout.yourgateway.com}"
    session-lifetime: 30m
    retention: 30d
    maximum-amount: 99999999
    payment-service:
      base-url: "${GATEWAY_PAYMENT_SERVICE_URL:http://localhost:8102}"
      internal-token: "${CHECKOUT_SERVICE_INTERNAL_SECRET:}"
    allowed-origins:
      - "${GATEWAY_CHECKOUT_ORIGIN:https://checkout.yourgateway.com}"
      - "${GATEWAY_CHECKOUT_LOCAL_ORIGIN:http://localhost:3000}"
    internal-callers:
      - id: token-service
        secret: "${TOKEN_SERVICE_INTERNAL_SECRET:}"

shared:
  security:
    merchant-service:
      base-url: "${GATEWAY_MERCHANT_SERVICE_URL:http://localhost:8101}"
    skip-paths:
      - /actuator/**
      - /internal/**
      - /checkout/**
